[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "GregRos", email = "gregros@gregros.dev" }]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic-ai (>=1.96.0,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
]

[project.scripts]
start = "main:start"
test = "test_runner:main"

[tool.poetry]
packages = [
    { include = "agent", from = "src" },
    { include = "db", from = "src" },
    { include = "api.py", from = "src" },
    { include = "config.py", from = "src" },
    { include = "main.py", from = "src" },
    { include = "server.py", from = "src" },
    { include = "test_runner.py", from = "src" },
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "pyright (>=1.1.409,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
]
